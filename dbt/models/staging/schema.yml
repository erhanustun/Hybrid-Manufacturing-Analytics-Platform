version: 2

models:
  - name: stg_machine_events
    description: >
      Cleaned and standardized staging model for manufacturing machine events.
      This model reads from the raw BigQuery external table and prepares the
      data for downstream analytics models.

    columns:
      - name: event_id
        description: Unique identifier of the machine event.
        tests:
          - not_null
          - unique

      - name: machine_id
        description: Identifier of the manufacturing machine.
        tests:
          - not_null

      - name: event_type
        description: Type or category of the machine event.
        tests:
          - not_null

      - name: event_time
        description: Timestamp when the machine event occurred.

      - name: error_code
        description: Error code associated with the event, when applicable.

      - name: payload
        description: Additional machine event attributes stored as JSON-formatted data.

      - name: cdc_op
        description: Debezium operation code describing the source database change.